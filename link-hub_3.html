<title>Shaxsiy Link Hub</title>

<!-- Tailwind CSS (CDN) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- FontAwesome ikonkalari (CDN) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ====== UMUMIY SOZLAMALAR ====== */
  /* Jonli (lively) fon uchun rang to'plami — bu yerdagi hex kodlarni o'zgartirsangiz, fon rangi butunlay o'zgaradi */
  :root{
    --bg-grad-1:#7c3aed; /* to'q binafsha */
    --bg-grad-2:#db2777; /* to'q pushti */
    --bg-grad-3:#0284c7; /* to'q moviy */
    --bg-grad-4:#ea580c; /* to'q sariq-qizil */
  }
  html.dark{
    --bg-grad-1:#3b0764;
    --bg-grad-2:#701a3f;
    --bg-grad-3:#082f49;
    --bg-grad-4:#6c2409;
  }

  * { font-family: 'Manrope', sans-serif; }

  body{
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
    transition: background 0.6s ease;
    background: linear-gradient(120deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
    background-size: 300% 300%;
    animation: gradientMove 14s ease infinite;
  }

  @keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }

  /* Fon ustida suzib yuruvchi rangli "blob" doiralar — jonlilik uchun */
  .bg-blob{
    position:fixed;
    border-radius:9999px;
    filter: blur(70px);
    opacity:0.55;
    z-index:0;
    pointer-events:none;
  }
  .blob-1{
    width:320px; height:320px;
    top:-60px; left:-80px;
    background:#f59e0b;
    animation: floatBlob1 16s ease-in-out infinite;
  }
  .blob-2{
    width:280px; height:280px;
    bottom:-60px; right:-70px;
    background:#ec4899;
    animation: floatBlob2 18s ease-in-out infinite;
  }
  .blob-3{
    width:250px; height:250px;
    top:40%; right:-90px;
    background:#0ea5e9;
    animation: floatBlob3 20s ease-in-out infinite;
  }

  @keyframes floatBlob1{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(40px,50px) scale(1.15); }
  }
  @keyframes floatBlob2{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-30px,-40px) scale(1.1); }
  }
  @keyframes floatBlob3{
    0%,100%{ transform: translate(0,0) scale(1); }
    50%{ transform: translate(-25px,30px) scale(1.2); }
  }

  /* Shisha effekti (Glassmorphism) */
  .glass{
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255,255,255,0.4);
    transition: background 0.4s ease, border-color 0.4s ease;
  }
  html.dark .glass{
    background: rgba(30,27,60,0.45);
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* Havola tugmalari uchun bosilish/hover animatsiyasi */
  .link-btn{
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.3s ease;
  }
  .link-btn:hover{
    transform: translateY(-3px) scale(1.015);
    box-shadow: 0 10px 25px -8px rgba(99,102,241,0.35);
  }
  .link-btn:active{
    transform: translateY(0) scale(0.98);
  }

  /* Ijtimoiy tarmoq doira ikonkalari */
  .social-icon{
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .social-icon:hover{
    transform: translateY(-4px) rotate(-4deg);
    box-shadow: 0 8px 18px -6px rgba(99,102,241,0.45);
  }

  /* Avatar atrofidagi yumshoq porlash */
  .avatar-glow{
    box-shadow: 0 0 0 4px rgba(255,255,255,0.6), 0 0 35px rgba(129,140,248,0.45);
  }
  html.dark .avatar-glow{
    box-shadow: 0 0 0 4px rgba(30,27,60,0.7), 0 0 35px rgba(129,140,248,0.35);
  }

  /* Dark/Light almashtirish tugmasi ichidagi ikonka aylanishi */
  .toggle-icon{
    transition: transform 0.5s ease, opacity 0.3s ease;
  }

  /* "Copy Link" bosilganda chiqadigan mini-xabar (toast) */
  #toast{
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  /* Sahifa yuklanganda paydo bo'lish animatsiyasi */
  .fade-in-up{
    opacity:0;
    transform: translateY(14px);
    animation: fadeInUp 0.6s ease forwards;
  }
  @keyframes fadeInUp{
    to{ opacity:1; transform: translateY(0); }
  }
</style>
</head>

<!-- ====== NUSXALASH TOASTI (bildirishnoma) ====== -->
<div id="toast"
  class="fixed bottom-6 left-1/2 -translate-x-1/2 opacity-0 pointer-events-none
         glass px-5 py-2.5 rounded-full text-sm font-semibold shadow-lg z-50 flex items-center gap-2">
  <i class="fa-solid fa-check text-emerald-500"></i>
  <span>Havola nusxalandi!</span>
</div>

<script>
  // ====== DARK / LIGHT MODE MANTIQI ======
  const htmlEl = document.documentElement;
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeIcon');

  // Foydalanuvchi tanlovini eslab qolish (localStorage)
  function applyTheme(theme){
    if(theme === 'dark'){
      htmlEl.classList.add('dark');
      themeIcon.classList.remove('fa-moon');
      themeIcon.classList.add('fa-sun');
    } else {
      htmlEl.classList.remove('dark');
      themeIcon.classList.remove('fa-sun');
      themeIcon.classList.add('fa-moon');
    }
  }

  // Avval saqlangan sozlamani yoki tizim sozlamasini tekshirish
  const savedTheme = localStorage.getItem('linkhub-theme');
  const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme || (systemPrefersDark ? 'dark' : 'light'));

  themeToggle.addEventListener('click', () => {
    const isDark = htmlEl.classList.contains('dark');
    const newTheme = isDark ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('linkhub-theme', newTheme);

    // Tugma bosilganda kichik aylanish animatsiyasi
    themeIcon.style.transform = 'rotate(360deg)';
    setTimeout(() => { themeIcon.style.transform = 'rotate(0deg)'; }, 500);
  });

  // ====== "COPY LINK" TUGMASI MANTIQI ======
  const copyLinkBtn = document.getElementById('copyLinkBtn');
  const toast = document.getElementById('toast');

  copyLinkBtn.addEventListener('click', () => {
    // Joriy sahifa havolasini nusxalaydi (o'zgartirmasa ham bo'ladi)
    const linkToCopy = window.location.href;

    navigator.clipboard.writeText(linkToCopy).then(() => {
      showToast();
    }).catch(() => {
      // Agar clipboard API ishlamasa (masalan eski brauzer), zaxira usul
      const tempInput = document.createElement('input');
      tempInput.value = linkToCopy;
      document.body.appendChild(tempInput);
      tempInput.select();
      document.execCommand('copy');
      document.body.removeChild(tempInput);
      showToast();
    });
  });

  function showToast(){
    toast.style.opacity = '1';
    toast.style.transform = 'translate(-50%, -8px)';
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translate(-50%, 0)';
    }, 1800);
  }
</script>
